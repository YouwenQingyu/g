<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0B0E14"/>
<title>第七码头没有潮汐</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#05070b}
body{font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:#e6edf6}
#app{height:100%;display:flex;flex-direction:column;background:#0B0E14;overflow:hidden}

/* ---------- 状态栏 ---------- */
.statusbar{flex:0 0 26px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:11px;color:#8b9bb4;letter-spacing:.4px;background:#090c12}
.statusbar .r{display:flex;align-items:center;gap:7px}
.sig{display:flex;align-items:flex-end;gap:2px;height:11px}
.sig i{display:block;width:3px;background:#8b9bb4;border-radius:1px}
.sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:6px}.sig i:nth-child(3){height:8px}.sig i:nth-child(4){height:11px;opacity:.35}
.batt{width:20px;height:10px;border:1px solid #8b9bb4;border-radius:2px;position:relative;padding:1px}
.batt::after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:4px;background:#8b9bb4;border-radius:0 1px 1px 0}
.batt em{display:block;height:100%;width:62%;background:#8b9bb4;border-radius:1px}

/* ---------- 工具栏 ---------- */
.toolbar{flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:6px 8px 8px;background:#0B0E14;border-bottom:1px solid #16202e}
.tb{width:30px;height:30px;flex:0 0 30px;border:0;background:transparent;color:#c8d6e8;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0}
.tb:disabled{color:#33404f}
.tb:active{background:#18212e}
.addr{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:32px;background:#161d29;border:1px solid #1f2a3a;border-radius:16px;padding:0 12px;font-size:12px;color:#8b9bb4;overflow:hidden;white-space:nowrap}
.addr .lk{flex:0 0 auto;color:#5f7285;display:flex}
.addr .dom{color:#dbe7f5;overflow:hidden;text-overflow:ellipsis}
.addr .path{color:#6d8098;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.loadbar{height:2px;background:#16202e;flex:0 0 2px;position:relative;overflow:hidden}
.loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2f6fed,#4ea3ff);opacity:0;transition:opacity .3s}

/* ---------- 内容区 ---------- */
.view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff}
.site{min-height:100%;padding:0 0 40px}

/* ---------- 底部工具栏 ---------- */
.bottom{flex:0 0 50px;display:flex;align-items:stretch;background:#090c12;border-top:1px solid #16202e;padding-bottom:env(safe-area-inset-bottom)}
.bottom button{flex:1;border:0;background:transparent;color:#7f90a8;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;padding:0}
.bottom button:disabled{color:#38434f}
.bottom button.arm{color:#f0a196}
.bottom button.arm .ic{transform:rotate(-90deg)}
.bottom button .ic{font-size:16px;line-height:1}
.bottom button .bd{position:absolute;top:6px;right:calc(50% - 18px);min-width:15px;height:15px;border-radius:8px;background:#2f6fed;color:#fff;font-size:9px;line-height:15px;text-align:center;padding:0 4px}

/* ---------- 通用页面元件 ---------- */
.p{padding:0 18px;margin:10px 0}
.h1{font-size:19px;line-height:1.45;font-weight:700;margin:14px 18px 8px}
.h2{font-size:15px;font-weight:700;margin:16px 18px 6px}
.meta{font-size:12px;color:#8b8b8b;padding:0 18px;margin-bottom:12px}
.card{margin:12px 14px;padding:14px;border-radius:12px;background:rgba(0,0,0,.03)}
.card.dark{background:#161b22;color:#c9d4e2}
.ttl{font-size:12px;letter-spacing:1px;font-weight:700;margin-bottom:8px;opacity:.75}
.row{display:flex;gap:8px;margin:10px 14px}
.inp{flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid #c9cdd4;background:#fff;color:#1a1a1a;padding:0 12px;font-size:14px;outline:none}
.inp:focus{border-color:#2f6fed}
.btn{height:40px;padding:0 16px;border:0;border-radius:10px;background:#2f6fed;color:#fff;font-size:14px;font-weight:600}
.btn:active{opacity:.8}
.btn.ghost{background:transparent;color:#2f6fed;border:1px solid #2f6fed}
.btn.wide{display:block;width:calc(100% - 28px);margin:12px 14px}
.link{color:#2f6fed;text-decoration:underline;text-underline-offset:2px}
.small{font-size:12px;color:#8b8b8b}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed rgba(0,0,0,.12);font-size:13px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{padding:6px 4px;text-align:left;border-bottom:1px solid rgba(0,0,0,.1)}
.tbl th{font-weight:600;opacity:.7;font-size:11.5px}
.hl{background:#fff2a8;color:#111;padding:0 2px;border-radius:2px}
.warnbox{margin:12px 14px;padding:12px 14px;border-left:3px solid #d84a3a;background:#fff3f0;color:#7a2620;font-size:13px;border-radius:0 10px 10px 0}
.okbox{margin:12px 14px;padding:12px 14px;border-left:3px solid #2f9e58;background:#eefaf2;color:#1d5c36;font-size:13px;border-radius:0 10px 10px 0}
.tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;background:rgba(0,0,0,.07);margin-right:6px;letter-spacing:.3px}

/* ---------- 新闻网 ---------- */
.site.news{background:#fff;color:#1a1a1a}
.nbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#c8261c;color:#fff}
.nbar .logo{font-size:17px;font-weight:800;letter-spacing:1px}
.nbar .nsub{font-size:11px;opacity:.85}
.nav{display:flex;gap:16px;padding:9px 16px;border-bottom:1px solid #e6e6e6;font-size:13px;color:#555;overflow:auto;white-space:nowrap}
.nav span{padding-bottom:2px}
.nav .on{color:#c8261c;font-weight:700;border-bottom:2px solid #c8261c}
.lead{font-size:14.5px;color:#333}
.cmt{padding:11px 0;border-bottom:1px solid #eee;font-size:13.5px}
.cmt .who{font-size:12px;color:#888;margin-bottom:3px}
.cmt.tap{position:relative}
.cmt.tap::after{content:"展开";position:absolute;right:0;top:11px;font-size:11px;color:#2f6fed}
.cmt.tap.open::after{content:"已展开";color:#9aa4b2}
.fold{display:block;width:calc(100% - 28px);margin:10px 14px;height:38px;border:1px dashed #b9c8da;border-radius:9px;background:#f6f9fd;color:#3a5a80;font-size:13px;font-family:inherit}
.fold:active{background:#e6eefa}
.evgot{margin:8px 0 0;padding:8px 10px;border:1px dashed #b9c8da;border-radius:9px;background:#f2f7fd;color:#3a5a80;font-size:12.5px;text-align:center}
.site.archive .evgot{border-color:#cfbfa2;background:#f7f1e4;color:#6b573b}
.site.port .evgot{border-color:#cfdae8;background:#f2f6fb;color:#33526f}
.site.forum .evgot{border-color:#2f4056;background:#131a24;color:#8fb6e0}
.site.lh .evgot{border-color:#1d5340;background:#04100c;color:#5fc39a;font-family:inherit;font-size:12px}
.site.archive .fold{border-color:#cfbfa2;background:#f7f1e4;color:#6b573b}
.site.port .fold{border-color:#cfdae8;background:#f2f6fb;color:#33526f}
.site.forum .fold{border-color:#2f4056;background:#131a24;color:#8fb6e0}
.site.lh .fold{border-color:#1d5340;background:#04100c;color:#5fc39a;font-family:inherit;font-size:12px}
.fold[data-act]{-webkit-appearance:none;appearance:none}
.ditem.off:active{background:#0f1620}
.berth div[data-act]{cursor:pointer}
.berth div[data-act]:active{filter:brightness(.94)}
.kv[data-act]{cursor:pointer}
.kv[data-act]:active{opacity:.6}

/* ---------- 政务内网 ---------- */
.site.gov{background:#eef2f7;color:#22303f}
.gbar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#1d3a5f;color:#fff}
.gbar .logo{font-size:14px;font-weight:700;letter-spacing:.5px}
.gbar .badge{font-size:10px;padding:2px 7px;border:1px solid rgba(255,255,255,.5);border-radius:3px}
.gnav{display:flex;gap:14px;padding:9px 16px;background:#24466f;color:#cfe0f5;font-size:12px;overflow:auto;white-space:nowrap}
.gcard{margin:12px 14px;padding:14px;border-radius:10px;background:#fff;border:1px solid #dbe3ee}
.site.gov .inp{border-color:#c3cfe0;background:#fff}
.site.gov .tbl th,.site.gov .tbl td{border-color:#e3e9f2}
.site.gov .kv{border-color:#e3e9f2}
.site.gov .warnbox{background:#fff4f2;border-color:#d84a3a;color:#7a2620}
.site.gov .okbox{background:#eefaf2;border-color:#2f9e58;color:#1d5c36}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ---------- 档案馆 ---------- */
.site.archive{background:#f3ece0;color:#3a3026}
.abar{padding:14px 16px;border-bottom:3px double #b9a88c;display:flex;align-items:baseline;justify-content:space-between}
.abar .logo{font-size:16px;font-weight:700;letter-spacing:3px;font-family:serif}
.abar .nsub{font-size:10.5px;color:#8a7a63}
.acard{margin:12px 14px;padding:14px;background:#fbf6ec;border:1px solid #d9c9ad}
.site.archive .inp{border-color:#cbb99b;background:#fffdf8;color:#3a3026}
.site.archive .tbl th,.site.archive .tbl td{border-color:#e0d3bb}
.site.archive .kv{border-color:#e0d3bb}
.site.archive .btn{background:#6d5a3e}
.site.archive .okbox{background:#f2f8ef;border-color:#5c8a4a;color:#2f4a24}
.docno{font-family:ui-monospace,monospace;font-size:11.5px;letter-spacing:1px;color:#8a7a63}
.qmark{color:#b03a2e;font-weight:700}

/* ---------- 物流调度 ---------- */
.site.port{background:#f7f8fa;color:#1d2733}
.pbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#0e3b52;color:#fff}
.pbar .logo{font-size:14px;font-weight:700}
.pbar .nsub{font-size:10.5px;opacity:.8}
.site.port .tbl th,.site.port .tbl td{border-color:#e2e7ee}
.site.port .kv{border-color:#e2e7ee}
.site.port .inp{border-color:#c9d2de}
.berth{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 14px}
.berth div{height:52px;border-radius:8px;background:#e7edf5;display:flex;align-items:center;justify-content:center;font-size:12px;color:#41546b;border:1px solid #d5dfec}
.berth div.off{background:#fff3e6;border-color:#e8b47a;color:#8a5418;font-weight:700}
.berth div span{font-size:10px;opacity:.75;margin-left:3px}

/* ---------- 博客 ---------- */
.site.blog{background:#fbfaf7;color:#2b2b2b}
.bbar{padding:16px;border-bottom:1px solid #e8e4dc;display:flex;align-items:center;justify-content:space-between}
.bbar .logo{font-size:15px;font-weight:700;letter-spacing:1px}
.bbar .nsub{font-size:10.5px;color:#9a958c}
.empty{padding:40px 18px;text-align:center;color:#9a958c;font-size:13px}
.exif{font-family:ui-monospace,monospace;font-size:12px;background:#f2f0ea;border:1px solid #e2ded4;border-radius:10px;padding:12px 14px;margin:12px 14px;line-height:2;color:#3a352c}

/* ---------- 论坛 ---------- */
.site.forum{background:#14181f;color:#c9d4e2}
.fbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#1b2230;border-bottom:1px solid #26303f}
.fbar .logo{font-size:14px;font-weight:700;letter-spacing:1px;color:#e3ecf7}
.fbar .nsub{font-size:10.5px;color:#7d8ca1}
.fthread{margin:12px 14px;padding:14px;background:#1a2029;border:1px solid #26303f;border-radius:10px}
.fthread .ft{font-size:16px;font-weight:700;color:#e8f0fa;margin-bottom:6px}
.fauthor{font-size:11.5px;color:#7d8ca1;margin-bottom:10px}
.site.forum .p{color:#b9c6d6}
.site.forum .card{background:#1a2029;border:1px solid #26303f;color:#b9c6d6}
.site.forum .inp{background:#10151c;border-color:#2b3546;color:#dbe6f4}
.site.forum .kv{border-color:#26303f}
.site.forum .small{color:#7d8ca1}
.site.forum .warnbox{background:#2a1a1a;color:#f0b4ac;border-color:#c0492f}
.site.forum .okbox{background:#16261d;color:#a8e0bb;border-color:#2f9e58}
.site.forum .link{color:#5aa7f5}
.attach{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px dashed #3a4a60;border-radius:9px;background:#10151c;margin-top:10px;font-size:13px;color:#9fb4cc}

/* ---------- 灯塔终端 ---------- */
.site.lh{background:#05090a;color:#6fe3a8;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.site.lh .term{padding:16px 18px;font-size:12.5px;line-height:2;white-space:pre-wrap;word-break:break-word}
.site.lh .term .dim{color:#2f7f5c}
.site.lh .term .warn{color:#e2b23a}
.site.lh .inp{background:#020605;border:1px solid #1d5340;color:#7dfcc0;font-family:inherit;font-size:13px;height:38px}
.site.lh .btn{background:#114d38;color:#b8ffdc;font-family:inherit}
.site.lh .h1,.site.lh .h2{color:#9dffcb;font-family:inherit}
.site.lh .small{color:#3f8f6c}
.site.lh .kv{border-color:#14352a;color:#7dfcc0;font-size:12px}
.site.lh .okbox{background:#06231a;border-color:#2f9e58;color:#a8f5c9;font-family:inherit}
.site.lh .warnbox{background:#231a06;border-color:#c99a2f;color:#f0d79a;font-family:inherit}
.site.lh .lt{flex:0 0 40px;font-family:inherit;font-size:13px;color:#6fe3a8;display:flex;align-items:center}
.site.lh .apx{margin:14px;border:1px solid #1d5340;background:#04100c;border-radius:10px;overflow:hidden}
.apxhead{padding:11px 14px;background:#0a1f18;border-bottom:1px solid #1d5340}
.apxhead .t1{font-size:12px;color:#5fc39a;letter-spacing:2px}
.apxhead .t2{font-size:10.5px;color:#2f7f5c;margin-top:4px;letter-spacing:.5px}
.apxbody{padding:4px 14px 14px}
.apx .tl{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed #12291f;font-size:12px;line-height:1.75}
.apx .tl:last-of-type{border-bottom:0}
.apx .tl .tm{flex:0 0 78px;color:#7dfcc0}
.apx .tl .tx{flex:1;color:#57b98f}
.apx .tl .tx b{color:#a8f5c9;font-weight:600}
.apx .apxend{margin-top:10px;padding-top:10px;border-top:1px solid #12291f;font-size:12px;line-height:1.9;color:#3f8f6c}
.apx .apxend em{font-style:normal;color:#7dfcc0}

/* ---------- 抽屉 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .22s;z-index:80}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;width:82%;max-width:340px;background:#0d131c;z-index:90;display:flex;flex-direction:column;transition:transform .26s cubic-bezier(.3,.8,.3,1);border-right:1px solid #1b2634}
.drawer#dSites{left:0;transform:translateX(-102%)}
.drawer#dEv{right:0;left:auto;transform:translateX(102%);border-right:0;border-left:1px solid #1b2634}
.drawer.on{transform:translateX(0)}
.dhead{padding:16px 16px 12px;border-bottom:1px solid #1b2634}
.dhead .dt{font-size:14px;font-weight:700;color:#e6edf6;letter-spacing:.5px}
.dhead .ds{font-size:11px;color:#7c8ea6;margin-top:3px}
.dbody{flex:1;overflow-y:auto;padding:8px 0 30px}
.ditem{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid #131c27}
.ditem:active{background:#131c27}
.ditem .num{flex:0 0 24px;height:24px;border-radius:7px;background:#1b2c42;color:#6fa8e8;font-size:10.5px;display:flex;align-items:center;justify-content:center;font-weight:700}
.ditem .nm{flex:1;min-width:0}
.ditem .nm b{display:block;font-size:13px;color:#d7e2f0;font-weight:600}
.ditem .nm span{display:block;font-size:10.5px;color:#6f829a;margin-top:1px}
.ditem.off{opacity:.42}
.ditem.off .num{background:#1a222c;color:#54657a}
.ditem .st{font-size:10px;color:#47b37a}
.ditem.off .st{color:#4d5c6d}
.dbar{padding:12px 16px 20px;border-top:1px solid #1b2634}
.prog{height:5px;border-radius:3px;background:#1a2433;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#2f6fed,#4ad991);width:0;transition:width .4s}
.rst{display:block;width:100%;margin-top:10px;height:36px;border:1px solid #2c3d52;border-radius:9px;background:transparent;color:#7b8da4;font-size:12px;font-family:inherit;letter-spacing:.3px;cursor:pointer;transition:background .18s,color .18s,border-color .18s}
.rst:active{background:#131c27}
.rst.arm{border-color:#8a3a30;background:#241210;color:#f0a196}

/* ---------- 提示条 ---------- */
.toast{position:fixed;left:50%;bottom:74px;transform:translate(-50%,14px);background:rgba(20,30,44,.96);border:1px solid #2b3d54;color:#dfeaf7;font-size:12.5px;padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.25s;z-index:120;max-width:86%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
::-webkit-scrollbar{width:0;height:0}
</style>
</head>
<body>
<div id="app">
  <div class="statusbar">
    <span id="clock">21:14</span>
    <span class="r">
      <span class="sig"><i></i><i></i><i></i><i></i></span>
      <span style="font-size:10px">4G</span>
      <span class="batt"><em></em></span>
    </span>
  </div>

  <div class="toolbar">
    <button class="tb" id="btnBack" aria-label="后退"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="tb" id="btnFwd" aria-label="前进"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="addr">
      <span class="lk"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>
      <span class="dom" id="addrDom">news.langang.cn</span>
      <span class="path" id="addrPath">/</span>
    </div>
    <button class="tb" id="btnReload" aria-label="刷新"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.6"/><path d="M20 5v6h-6"/></svg></button>
  </div>

  <div class="loadbar"><i id="loadbar"></i></div>

  <div class="view" id="view"></div>

  <div class="bottom">
    <button id="bbReset"><span class="ic">↻</span><span id="bbResetTx">重新游戏</span></button>
    <button id="bbHome"><span class="ic">⌂</span><span>主页</span></button>
    <button id="bbSites"><span class="ic">☰</span><span>站点</span></button>
    <button id="bbEv"><span class="ic">▣</span><span>证物</span><span class="bd" id="evBadge">0</span></button>
  </div>
</div>

<div class="mask" id="mask"></div>

<div class="drawer" id="dSites">
  <div class="dhead">
    <div class="dt">已发现站点</div>
    <div class="ds" id="siteSub">解锁进度 1 / 8</div>
  </div>
  <div class="dbody" id="siteList"></div>
  <div class="dbar">
    <div class="small" id="storeNote" style="color:#6f829a;font-size:11px">案卷编号 07-0314 · 本地存档</div>
    <div class="prog"><i id="siteProg"></i></div>
    <button class="rst" id="btnReset" data-act="rst">重置游戏 · 清空全部进度</button>
  </div>
</div>

<div class="drawer" id="dEv">
  <div class="dhead">
    <div class="dt">物证档案</div>
    <div class="ds" id="evSub">已归档 0 / 10</div>
  </div>
  <div class="dbody" id="evList"></div>
  <div class="dbar">
    <div class="prog"><i id="evProg"></i></div>

<script>
(function(){

/* ================= 存档 ================= */

function clone(o){return JSON.parse(JSON.stringify(o));}

/* 存档通道：localStorage 不可用时降级为内存存档，并在抽屉里明示 */
var LS=(function(){
  try{
    var k='__dock7_probe__';
    window.localStorage.setItem(k,'1');
    window.localStorage.removeItem(k);
    return window.localStorage;
  }catch(e){return null;}
})();
var memRaw=null;

function load(){
  try{
    var raw=LS?LS.getItem(KEY):memRaw;
    if(!raw)return clone(DEF);
    var s=JSON.parse(raw),d=clone(DEF);
    for(var k in d){if(!(k in s))s[k]=d[k];}
    for(var f in d.fields){if(!(f in s.fields))s.fields[f]=d.fields[f];}
    return s;
  }catch(e){return clone(DEF);}
}
function save(){
  var raw=JSON.stringify(st);
  if(!LS){memRaw=raw;return;}
  try{LS.setItem(KEY,raw);}
  catch(e){LS=null;memRaw=raw;}
}
var st=load();

/* ================= 重置 ================= */
var rstTimer=null;
function disarmReset(){
  clearTimeout(rstTimer);rstTimer=null;
  var b=document.getElementById('btnReset');
  if(b){b.classList.remove('arm');b.textContent='重置游戏 · 清空全部进度';}
  var bb=document.getElementById('bbReset');

  var tx=document.getElementById('bbResetTx');

}
function armReset(){
  var b=document.getElementById('btnReset');

  var bb=document.getElementById('bbReset');
  if(bb){bb.classList.add('arm');}
  var tx=document.getElementById('bbResetTx');
  if(tx){tx.textContent='再点一次·清档';}

}
/* 真正的清档：存储、状态、路由、提示队列一起归零 */

/* ================= 物证 ================= */
var EVID=[
 ['e1','新闻剪报','沈砚舟失联报道 2019-03-15'],
 ['e2','原始观测记录','19:34 满潮 3.87m'],
 ['e3','对外潮汐表差异','发布版本 18:54 满潮'],
 ['e4','B区断电记录','19:34 - 19:41 共 7 分钟'],
 ['e5','B-14 检修通道','连通第八码头旧泊位'],
 ['e6','港区泊位图','8号位为未开放预留区'],
 ['e7','船期异常','浙岚渔032 无靠泊记录'],
 ['e8','照片元数据','经度 E118°19′'],
 ['e9','气压计刻痕','纬度 N35°07′'],
 ['e10','双坐标交点','第八码头外海 0.31 海里']
];
function hasEv(id){return st.ev.indexOf(id)>=0;}
function evName(id){
  for(var i=0;i<EVID.length;i++){if(EVID[i][0]===id)return EVID[i][1];}
  return '';
}
/* 只写入数据，不写 DOM、不弹提示。提示由调用方决定。 */
function addEv(id){
  if(hasEv(id))return false;

  return true;
}
function unlockSite(k){
  if(!SITES[k]||st.sites.indexOf(k)>=0)return false;

  return true;
}

/* 线索到手判定：站点可进、或关键物证已归档，都算线索已经落到手里 */

var EVON={e2:'wlogin',e3:'wlogin',e4:'wlogin',e5:'arc',e6:'prt',e7:'prt',e8:'exif',e9:'frm'};
function revealed(k){
  if(st.sites.indexOf(k)>=0)return true;

}

/* 玩家主动归档：只有点了才算拿到，提示只在这里出现 */
function collectEv(id){
  if(!addEv(id))return false;
  toast('物证归档 · '+evName(id));
  return true;
}
/* 物证控件：未归档是可点的按钮，归档后变成状态条 */
function evBox(id,label){
  var nm=evName(id);
  if(hasEv(id))return '<div class="evgot">已归档 · '+nm+'</div>';

/* ================= 提示（排队，不互相覆盖） ================= */
var tEl=document.getElementById('toast'),tQueue=[],tBusy=false,tT1=null,tT2=null;
function toast(msg){
  if(!msg)return;
  tQueue.push(msg);
  if(!tBusy)nextToast();
}
function nextToast(){
  var msg=tQueue.shift();
  if(msg===undefined){tBusy=false;tEl.classList.remove('on');return;}
  tBusy=true;
  tEl.textContent=msg;
  tEl.classList.add('on');
  clearTimeout(tT1);clearTimeout(tT2);
  tT1=setTimeout(function(){
    tEl.classList.remove('on');
    tT2=setTimeout(nextToast,220);
  },1500);
}
/* 一次批量播报，避免中途被后来的提示挤掉 */
function toastAll(list){
  for(var i=0;i<list.length;i++)toast(list[i]);
}

/* ================= 站点 ================= */
var SITES={

};
var ORDER=['news','notice','weather','archive','port','blog','forum','lh'];

/* ================= 路由 ================= */
var nav={stack:['news'],i:0};
var view=document.getElementById('view');
var addrDom=document.getElementById('addrDom');
var addrPath=document.getElementById('addrPath');

var btnFwd=document.getElementById('btnFwd');
var loadbar=document.getElementById('loadbar');
var lt;

function runLoad(){
  loadbar.style.transition='none';loadbar.style.width='0%';loadbar.style.opacity='1';

function paint(anim){

  document.getElementById('bbResetTx').textContent=bbr.classList.contains('arm')?'再点一次·清档':'重新游戏';

  if(anim)runLoad();
}
function go(key){
  if(!SITES[key])return;
  nav.stack=nav.stack.slice(0,nav.i+1);
  if(nav.stack[nav.i]!==key){nav.stack.push(key);nav.i=nav.stack.length-1;}
  closeDrawers();
  paint(true);
}
btnBack.onclick=function(){if(nav.i>0){nav.i--;paint(true);}};
btnFwd.onclick=function(){if(nav.i<nav.stack.length-1){nav.i++;paint(true);}};
document.getElementById('bbReset').onclick=function(){

};

/* ================= 抽屉 ================= */

/* ================= 交互 ================= */
function norm(s){return (s||'').toUpperCase().replace(/[\s　]/g,'').replace(/[′’`]/g,"'").replace(/°/g,'');}

/* 坐标规范化：全角转半角，容忍空格、符号、方向字母，统一成 35°07′ 这种形状
   纯数字输入时按末两位自动切成“分”：3507 -> 35°07′、11819 -> 118°19′ */
function normDMS(s){
  var v=(s||'');
  v=v.replace(/[Ａ-Ｚａ-ｚ０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248);});
  v=v.replace(/[　\s]/g,'').toUpperCase();
  v=v.replace(/[°º˚度]/g,'°');
  v=v.replace(/[′’‘`´分]/g,'′');
  v=v.replace(/[″”"秒]/g,'″');
  var dir=(v.match(/[NSEW]/)||[''])[0];
  var d=v.replace(/[^0-9]/g,'');
  if(!d)return '';
  var deg=d,min='';
  if(v.indexOf('°')>=0){
    var m=v.match(/(\d+)°(\d{0,2})/);
    if(m){deg=m[1];min=m[2]||'';}
  }
  if(min===''){
    if(deg.length>=4){min=deg.slice(-2);deg=deg.slice(0,-2);}
    else{min='00';}
  }
  deg=String(parseInt(deg,10));
  min=('0'+min).slice(-2);
  return dir+deg+'°'+min+'′';
}

/* 坐标判定：kind 为 lat / lon。纯数字、带方向、带度分符号都认，方向写反则不算 */
function coordHit(raw,kind){
  var t=normDMS(raw);
  if(!t)return false;
  var dir=t.charAt(0);
  var body=t.replace(/^[NSEW]/,'');
  if(kind==='lat'){
    if(dir==='E'||dir==='W')return false;
    return body==='35°07′';
  }
  if(dir==='N'||dir==='S')return false;
  return body==='118°19′';
}

document.addEventListener('click',function(e){
  var t=e.target;
  while(t&&t!==document&&!(t.getAttribute&&t.getAttribute('data-act'))){t=t.parentNode;}
  if(!t||t===document)return;
  var act=t.getAttribute('data-act');

  if(act==='noop'){toast('该页面不在存档范围内');return;}
  if(act==='lock'){
    toast('这里还没线索能进去');
    return;
  }
  if(act==='ev'){
    var evid=t.getAttribute('data-ev');
    if(!evid){return;}
    if(collectEv(evid)){
      paint(false);
    }else{
      toast(EVTIP[evid]||'这条物证还拿不到');
    }
    return;
  }
  if(act==='go'){go(t.getAttribute('data-site'));return;}
  if(act==='peek'){
    var id=t.getAttribute('data-ev');
    for(var i=0;i<EVID.length;i++){if(EVID[i][0]===id){toast(EVID[i][1]+' · '+EVID[i][2]);break;}}
    return;
  }
  if(act==='cmt2'){
    if(!st.reveals.cmt2){st.reveals.cmt2=true;save();toast('评论已展开');unlockSite('weather');paint(false);}
    return;
  }
  if(act==='cmt3'){
    if(!st.reveals.cmt3){st.reveals.cmt3=true;save();toast('评论已展开');unlockSite('notice');paint(false);}
    return;
  }
  if(act==='cmt4'){
    if(!st.reveals.cmt4){st.reveals.cmt4=true;save();toast('评论已展开');paint(false);}
    return;
  }
  /* 红鱼：看着像线索，点开才知道是错的。点过一次就记住，不再重复提醒 */
  if(act==='rh'){
    var tip=t.getAttribute('data-tip')||'这条对不上';
    toast(tip);
    return;
  }
  if(act==='wlogin'){
    var uid=(st.fields.uid||'').toLowerCase().replace(/\s/g,'');
    var pw=(st.fields.pw||'').replace(/\s/g,'');
    if(uid==='syz2019'&&pw==='170427'){
      st.reveals.wlogin=true;st.err=0;save();
      unlockSite('archive');unlockSite('port');
      toast('登录成功 · 观测记录已调取');
      paint(false);
    }else{
      st.err=(st.err||0)+1;save();
      toast('工号或密码错误');
      paint(false);
    }
    return;
  }
  if(act==='asearch'){
    var kw=(st.fields.kw||'').toLowerCase().replace(/[\s\-_]/g,'');
    if(/b14|检修|停电|通道|0314|潮汐|泊位/.test(kw)&&kw.length>0){
      st.reveals.arc=true;st.reveals.arcErr=false;save();
      unlockSite('blog');
      toast('命中 1 条卷宗');
      paint(false);
    }else{
      st.reveals.arcErr=true;st.reveals.arc=false;save();
      toast('未检索到卷宗');
      paint(false);
    }
    return;
  }
  if(act==='portrec'){
    st.reveals.prt=true;save();
    unlockSite('forum');
    toast('靠泊记录已调取');
    paint(false);
    return;
  }
  if(act==='exif'){
    st.reveals.exif=true;save();
    toast('元数据已解析');
    paint(false);
    return;
  }
  if(act==='fopen'){
    var p=(st.fields.pw2||'').replace(/\s/g,'');
    if(p==='1942'){
      st.reveals.frm=true;st.reveals.frmErr=false;save();
      unlockSite('lh');
      toast('附件解压成功');
      paint(false);
    }else{
      st.reveals.frmErr=true;st.err2=(st.err2||0)+1;save();
      toast('密码错误');
      paint(false);
    }
    return;
  }
  if(act==='lhcheck'){
    var okL=coordHit(st.fields.lat,'lat'),okO=coordHit(st.fields.lon,'lon');
    if(okL&&okO){
      st.reveals.lhErr=false;
      st.reveals.final=true;
      st.reveals.lh=true;
      save();
      if(addEv('e10')){toast('物证归档 · 双坐标交点');}
      toast('坐标匹配成功');
      paint(false);
    }else{
      st.reveals.lhErr=true;save();
      toast((st.fields.lat||st.fields.lon)?'坐标匹配失败':'纬度 / 经度 均需填写');
      paint(false);
    }
    return;
  }
  if(act==='reset'){
    doReset();
    return;
  }
  if(act==='rst'){
    var rb=document.getElementById('btnReset');
    if(rb&&rb.classList.contains('arm')){doReset();}
    else{armReset();toast('再点一次确认清空进度');}
    return;
  }
},false);

document.addEventListener('input',function(e){
  var f=e.target.getAttribute&&e.target.getAttribute('data-f');
  if(f){st.fields[f]=e.target.value;save();}
},false);

document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var id=e.target.getAttribute&&e.target.getAttribute('data-enter');
  if(id){var b=document.getElementById(id);if(b){e.preventDefault();b.click();}}
},false);

/* ================= 时钟 ================= */
function clock(){
  var d=new Date(),h=d.getHours(),m=d.getMinutes();
  document.getElementById('clock').textContent=(h<10?'0':'')+h+':'+(m<10?'0':'')+m;
}
clock();setInterval(clock,20000);

/* ================= 启动 ================= */
paint(true);

})();
